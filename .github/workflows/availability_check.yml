# ASAP Pipeline — Deal Availability Check
# Runs at 8:45 AM and 2:45 PM US Pacific Time — always 15 min before the scraper
# PDT (UTC-7): 15:45 and 21:45 UTC

name: Deal Availability Check

on:
  schedule:
    - cron: "45 15 * * *"   # 8:45 AM Pacific (summer)
    - cron: "45 21 * * *"   # 2:45 PM Pacific (summer)
  workflow_dispatch: {}      # manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run availability check
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_SVC:       ${{ secrets.SUPABASE_SVC }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
        run: python availability_check.py
