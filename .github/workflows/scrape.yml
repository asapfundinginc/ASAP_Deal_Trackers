# ASAP Pipeline — WorkingMoni Deal Scraper
# Runs at 9:00 AM and 3:00 PM US Pacific Time
# PDT (UTC-7): 16:00 and 22:00 UTC
# PST (UTC-8): 17:00 and 23:00 UTC

name: WorkingMoni Deal Scraper

on:
  schedule:
    - cron: "0 16 * * *"    # 9:00 AM Pacific (summer)
    - cron: "0 22 * * *"    # 3:00 PM Pacific (summer)
  workflow_dispatch: {}      # manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_SVC:       ${{ secrets.SUPABASE_SVC }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
        run: python scraper.py

      - name: Commit updated seen_deals.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_deals.json
          git diff --staged --quiet || git commit -m "chore: update seen deals [skip ci]"
          git push
