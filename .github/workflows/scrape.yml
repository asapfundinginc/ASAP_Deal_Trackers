# ASAP Pipeline — WorkingMoni Deal Scraper
# Runs at 9 AM and 3 PM US Pacific Time
# 9 AM PDT = 16:00 UTC | 3 PM PDT = 22:00 UTC
# (Adjust +1 hr in winter: PST = UTC-8)

name: WorkingMoni Deal Scraper

on:
  schedule:
    - cron: "0 16 * * *"   # 9:00 AM Pacific
    - cron: "0 22 * * *"   # 3:00 PM Pacific
  workflow_dispatch: {}     # manual trigger from Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_SVC:       ${{ secrets.SUPABASE_SVC }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
        run: python scraper.py

      - name: Commit updated seen_deals.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_deals.json
          git diff --staged --quiet || git commit -m "chore: update seen deals list [skip ci]"
          git push
